<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تسجيل الدخول - منصة لغة الضاد</title>
    <link rel="stylesheet" href="css/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link rel="icon" type="image/png" href="images/11556ed682a6202096457d95623ca548.jpg">
</head>
<body>

    <header class="main-header">
        <div class="container nav-container">
            <div class="logo-box">
                <span>📚</span>
                <h1 class="logo-text">منصة لغة الضاد</h1>
            </div>
            <nav class="nav-links">
                <a href="index.html">الرئيسية</a>
            </nav>
        </div>
    </header>

    <section class="auth-section">
        <div class="auth-card">

            <div class="auth-header">
                <h2 id="form-title">تسجيل دخول الطلاب</h2>
                <p id="form-subtitle">أدخل بياناتك للمتابعة إلى الامتحانات الخاصة بك</p>
            </div>

            <div class="auth-tabs">
                <button type="button" class="tab-btn active" id="login-tab" onclick="switchMode('login')">تسجيل دخول</button>
                <button type="button" class="tab-btn" id="register-tab" onclick="switchMode('register')">حساب جديد</button>
            </div>

            <form id="auth-form" onsubmit="handleAuth(event)">

                <div class="form-group">
                    <label>إنشاء اسم مستخدم</label>
                    <input type="text" id="username" class="form-control" required placeholder="أدخل اسمك">
                </div>

                <div class="form-group">
                    <label>كلمة المرور</label>
                    <input type="password" id="password" class="form-control" required placeholder="••••••••">
                </div>

                <div class="form-group hidden" id="grade-group">
                    <label>اختر صفك الدراسي</label>
                    <select id="student-grade" class="form-control">
                        <option value="3-prep">الصف الثالث الإعدادي</option>
                        <option value="1-sec">الصف الأول الثانوي</option>
                        <option value="2-sec">الصف الثاني الثانوي</option>
                        <option value="3-sec">الصف الثالث الثانوي</option>
                    </select>
                </div>

                <div class="form-group hidden" id="education-type-group">
                    <label>نوع التعليم (الشعبة)</label>
                    <select id="education-type" class="form-control">
                        <option value="general">تعليم عام</option>
                        <option value="azhar">تعليم أزهري</option>
                    </select>
                </div>

                <div class="key-box hidden" id="key-group">
                    <div class="form-group" style="margin-bottom: 0;">
                        <label>🔑 مفتاح التسجيل الخاص (من المعلمة)</label>
                        <input type="text" id="secret-key" class="form-control" placeholder="أدخل الكي الخاص بك هنا">
                    </div>
                </div>

                <button type="submit" class="btn-submit" id="submit-btn">دخول للمنصة</button>
            </form>

        </div>
    </section>

    <footer class="main-footer">
        <div class="container">
            <p>جميع الحقوق محفوظة © منصة لغة الضاد التعليمية 2026</p>
        </div>
    </footer>

    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
    <script src="js/firebase-config.js"></script>

    <script src="js/auth.js"></script>
</body>
</html>
